name: GlassMail Android CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: glassmail-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore release signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/glassmail-release.p12
          test -s app/glassmail-release.p12

      - name: Test and lint
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug --stacktrace --no-daemon

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Verify signed APK
        if: github.event_name != 'pull_request'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" dist/GlassMail-1.0.0.apk
          sha256sum dist/GlassMail-1.0.0.apk > dist/GlassMail-1.0.0.apk.sha256
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/GlassMail-1.0.0.apk | head -12

      - name: Upload workflow artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: GlassMail-1.0.0-signed
          path: |
            dist/GlassMail-1.0.0.apk
            dist/GlassMail-1.0.0.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.0 dist/GlassMail-1.0.0.apk dist/GlassMail-1.0.0.apk.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.0.0 dist/GlassMail-1.0.0.apk dist/GlassMail-1.0.0.apk.sha256 \
              --target "$GITHUB_SHA" --title "澄邮 GlassMail 1.0.0" --notes-file CHANGELOG.md --repo "$GITHUB_REPOSITORY"
          fi
